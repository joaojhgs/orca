name: orca-manager
version: 0.1.0
description: Scoped Orca supervision and host-owned LLM access for local memory.
author: Orca fork
license: MIT
provides_tools:
  - orca_cli
  - orca_supervision
  - orca_sessions_read
  - orca_manager_inspect
  - orca_manager_act
  - orca_events_read
  - orca_events_wait
requires_auth:
  - openai-codex
config_schema:
  use_standard_cli: {type: bool, default: false, description: Use the ordinary agent CLI without manager-owned Run restrictions}
  orca_public_executable: {type: str, default: '', description: Absolute normal relay CLI executable}
  native_triage_retry_seconds: {type: int, default: 300, description: Retry an unacknowledged triage after 120 to 1800 seconds}
  native_progress_digest_seconds: {type: int, default: 10800, description: Check active-work progress digests every three hours; significant milestones remain event-driven}
  native_isolated_events:
    type: bool
    default: false
    description: Triage durable event batches in isolated native cron sessions instead of human chats
  enable_event_tools: {type: bool, default: false, description: Allow ordinary Hermes sessions to read scoped Orca events without adapter decisions}
  memory_port: {type: int, default: 8789, description: Loopback-only memory LLM port}
  memory_secret_file: {type: str, default: '', description: Private shared-secret file for the memory backend}
  memory_model_alias: {type: str, default: hermes-memory, description: Accepted memory backend model alias}
  orca_executable: {type: str, default: '', description: Operator-approved absolute public Orca CLI path}
  orca_credential_file: {type: str, default: '', description: Private scoped service-principal credential file}
  hermes_executable: {type: str, default: '', description: Operator-approved absolute native Hermes CLI path}
  max_session_decisions: {type: int, default: 12, description: Rotate each objective session after 1 to 20 completed decisions}
