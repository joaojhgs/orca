AllowUsers hermes-transport
Match User hermes-transport
    AuthorizedKeysFile /etc/hermes-manager/transport-authorized-keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    # OpenSSH requires remote admission for Unix forwards; PermitListen denies every TCP listener.
    AllowTcpForwarding remote
    PermitOpen none
    PermitListen none
    AllowStreamLocalForwarding remote
    StreamLocalBindMask 0117
    StreamLocalBindUnlink yes
    ForceCommand /bin/false
Match all
